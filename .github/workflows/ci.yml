name: CI

on:
  push:
    branches: [main, master, '*.x']
  pull_request:
    branches: [main, master, '*.x']
    types: [opened, synchronize, reopened, ready_for_review]
  # composer.lock is not committed and CI runs composer update, so new releases of
  # laravel-query-wizard, es-scout-driver, Laravel or the Elasticsearch client can
  # break a green build without a single commit here. Re-run weekly.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  # Keyed by event too: without it a push to master shares a group with the
  # scheduled run on the same ref and cancel-in-progress kills the canary.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ES ${{ matrix.elasticsearch }}${{ matrix.dependencies == 'lowest' && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      elasticsearch:
        image: elasticsearch:${{ matrix.elasticsearch }}
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd="curl -f http://localhost:9200/_cluster/health"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12', '13']
        elasticsearch: ['8.19.22', '9.5.3']
        dependencies: ['highest']
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
          # The client major has to match the server's.
          - elasticsearch: '8.19.22'
            es_client: '8'
          - elasticsearch: '9.5.3'
            es_client: '9'
          - php: '8.2'
            laravel: '12'
            testbench: '10'
            elasticsearch: '8.19.22'
            es_client: '8'
            dependencies: 'lowest'
            framework-floor: '12.69.0'
          # The Laravel 13 floor runs on ES 9, so the lowest legs cover both client majors.
          - php: '8.3'
            laravel: '13'
            testbench: '11'
            elasticsearch: '9.5.3'
            es_client: '9'
            dependencies: 'lowest'
            framework-floor: '13.30.0'
        exclude:
          # Laravel 13 requires PHP 8.3+
          - php: '8.2'
            laravel: '13'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-es-${{ matrix.es_client }}-${{ matrix.dependencies }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-es-${{ matrix.es_client }}-${{ matrix.dependencies }}-composer-

      # Lowest legs pin guzzlehttp/psr7 to 2.x: Guzzle 7 still allows psr7 1.x,
      # which has no PSR-17 factories, and the Elasticsearch client then fails to
      # build. Laravel applications never resolve that combination.
      - name: Install dependencies
        run: |
          composer update \
            --with="laravel/framework:^${{ matrix.laravel }}.0" \
            --with="orchestra/testbench:^${{ matrix.testbench }}.0" \
            --with="elasticsearch/elasticsearch:^${{ matrix.es_client }}.0" \
            ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable --with=guzzlehttp/psr7:^2.0' || '' }} \
            --prefer-dist --no-interaction --no-progress

      # A lowest leg that silently resolves above the declared floor stops
      # testing the floor at all.
      - name: Confirm the declared framework floor was installed
        if: matrix.dependencies == 'lowest'
        run: |
          installed=$(composer show laravel/framework --format=json | php -r 'echo json_decode(stream_get_contents(STDIN), true)["versions"][0];')
          echo "laravel/framework ${installed}"
          test "${installed}" = "v${{ matrix.framework-floor }}"

      - name: Show the installed Elasticsearch client
        run: |
          for package in elasticsearch/elasticsearch babenkoivan/elastic-migrations; do
            composer show "${package}" | grep -E '^(name|versions) '
          done

      - name: Run tests
        run: vendor/bin/phpunit --colors=always
        env:
          ELASTIC_HOST: localhost:9200
          TESTBENCH_CONVERT_DEPRECATIONS_TO_EXCEPTIONS: 'true'

  static-analysis:
    name: Static Analysis (PHPStan, PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '12'
            testbench: '10'
          - php: '8.5'
            laravel: '13'
            testbench: '11'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-phpstan-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-phpstan-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: |
          composer update \
            --with="laravel/framework:^${{ matrix.laravel }}.0" \
            --with="orchestra/testbench:^${{ matrix.testbench }}.0" \
            --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G

  # The Unit suite needs no Elasticsearch, so coverage and mutation testing run without one.
  coverage:
    name: Coverage and mutation testing (Unit, PHP 8.4 / Laravel 13)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo_sqlite
          coverage: pcov
          tools: composer:v2, infection:0.35

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-coverage-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-coverage-composer-

      - name: Install dependencies
        run: |
          composer update \
            --with="laravel/framework:^13.0" \
            --with="orchestra/testbench:^11.0" \
            --prefer-dist --no-interaction --no-progress

      - name: Run tests with coverage
        run: vendor/bin/phpunit --testsuite=Unit --coverage-text --coverage-clover=build/coverage/clover.xml --only-summary-for-coverage-text

      # Report-only until the surviving mutants are triaged; minMsi in infection.json5 then becomes the floor.
      # A full run takes too long for every push, so pushes and pull requests mutate only changed lines.
      # A push compares with the commit it replaced; a new or rewritten branch falls back to the default branch.
      - name: Run mutation testing on changed lines
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="origin/${{ github.base_ref || github.event.repository.default_branch }}"
          if [ "${{ github.event_name }}" = push ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="${BEFORE}"
          fi
          infection --threads=max --no-progress --git-diff-lines --git-diff-base="${base}" --ignore-msi-with-no-mutations

      - name: Run mutation testing
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: infection --threads=max --no-progress

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-and-mutation
          path: build/
          if-no-files-found: ignore

  code-style:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-style-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-style-composer-

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: ${{ runner.os }}-audit-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-audit-composer-

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Audit dependencies
        run: composer audit
